name: publish-image
run-name: 'StrimKeep ${{ github.ref_name }} · 发布镜像'
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test:
    uses: ./.github/workflows/tests.yml
  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: ver
        name: Resolve main image and exact-commit release tags
        run: |
          python3 dev/tools/image_version.py --github-output >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Check release version and CHANGELOG
        if: steps.ver.outputs.release == 'true'
        env:
          GITHUB_REF_TYPE: tag
          GITHUB_REF_NAME: ${{ steps.ver.outputs.tag }}
        run: python3 dev/tools/release_check.py
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.ver.outputs.image }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.value }},enable=${{ steps.ver.outputs.release == 'true' }}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-args: |
            APP_VERSION=${{ steps.ver.outputs.value }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
