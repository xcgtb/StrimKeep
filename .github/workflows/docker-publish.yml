name: docker-publish

# 打 tag（v*）或手动触发时，构建镜像并推送到 GHCR：
#   ghcr.io/<owner>/<repo>:<版本> / :latest / :sha-xxxx
# 用仓库自带的 GITHUB_TOKEN，不需要额外 secret（需要 workflow 的 packages: write 权限）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "额外标签（默认取 backend 版本号）"
        required: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: meta
        shell: bash
        run: |
          version=$(python3 - <<'PY'
          import io, re
          text = io.open('backend/strimkeep/__init__.py', encoding='utf-8').read()
          print(re.search(r"__version__\s*=\s*'([^']+)'", text).group(1))
          PY
          )
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "版本 $version → $image"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tags
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.image }}
          tags: |
            type=raw,value=${{ github.event.inputs.tag || steps.meta.outputs.version }}
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
