name: ci-and-publish

# 任何推送/PR 先跑后端全量 + 前端类型检查/构建；只有 v* tag 才发布镜像。
# 之前的 docker-publish 是「打 tag 直接发布」，测试通过与否完全靠自觉。
on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "额外标签（默认取 backend 版本号）"
        required: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --upgrade pip
          pip install -r backend/requirements-dev.txt

      - name: Backend full suite
        working-directory: backend
        run: python -m pytest tests -q --tb=short

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Frontend install
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Frontend unit tests
        working-directory: frontend
        run: npm test

      - name: Frontend typecheck and build
        working-directory: frontend
        run: npm run build

  smoke:
    # 生产模式冒烟：构建真实镜像，启动 supervisor + Web + Worker，
    # 验证 /health/ready、worker heartbeat，且日志没有启动期锁冲突/Traceback。
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: strimkeep:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start container
        run: |
          mkdir -p smoke/data smoke/strm
          docker run -d --name sk-smoke -p 19000:9000 \
            -v "$PWD/smoke/data:/data" -v "$PWD/smoke/strm:/strm" \
            -e ADMIN_USERNAME=admin -e ADMIN_PASSWORD=testpassword123 \
            strimkeep:smoke

      - name: Verify ready and worker heartbeat
        run: |
          ok=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:19000/health/ready; then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" != "1" ]; then
            echo "container did not become ready"
            docker logs sk-smoke
            exit 1
          fi
          docker exec -i sk-smoke python - <<'PY'
          import sqlite3
          connection = sqlite3.connect('file:/data/data/state.db?mode=ro', uri=True)
          row = connection.execute(
              "SELECT value FROM meta WHERE key='worker_heartbeat'").fetchone()
          assert row, 'worker heartbeat missing'
          print('heartbeat', row[0])
          PY
          if docker logs sk-smoke 2>&1 | grep -Ei 'Traceback|database is locked|UNIQUE constraint'; then
            echo "startup log contains a fatal error"
            docker logs sk-smoke
            exit 1
          fi

      - name: Cleanup
        if: always()
        run: docker rm -f sk-smoke || true

  publish:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [test, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - id: meta
        shell: bash
        run: |
          version=$(python3 - <<'PY'
          import io, re
          text = io.open('backend/strimkeep/__init__.py', encoding='utf-8').read()
          print(re.search(r"__version__\s*=\s*'([^']+)'", text).group(1))
          PY
          )
          image="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "版本 $version → $image"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tags
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.meta.outputs.image }}
          tags: |
            type=raw,value=${{ github.event.inputs.tag || steps.meta.outputs.version }}
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
