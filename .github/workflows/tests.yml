name: checks
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install -r dev/requirements.txt
      - name: Static and release boundaries
        run: |
          python dev/tools/static_check.py
          python dev/tools/release_check.py
      - name: Vue frontend against isolated real backend
        run: python frontend/tests/backend_smoke.py
      - name: Python regression
        run: pytest dev/tests/ -q
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build runtime-only image
        run: docker build -t strimkeep:ci .
      - name: Historical SQLite compatibility without test packages
        run: docker run --rm --network none -i --entrypoint python strimkeep:ci - < dev/checks/verify_docs_schema_compat.py
      - name: Live HTTP, SQLite writes and restart
        run: docker run --rm --network none -i --entrypoint python strimkeep:ci - < dev/checks/verify_release_startup.py

  vue3:
    # Playwright 1.56 ships browser dependencies for this supported image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install Vue frontend dependencies
        run: npm ci --prefix frontend
      - name: Typecheck, unit tests and production build
        run: |
          npm --prefix frontend run format:check
          npm --prefix frontend test
          npm --prefix frontend run build
          node dev/tools/verify_frontend.cjs
          # Runtime Docker stage compiles from Vue sources, not checked-in static hashes.
          # Production entry and generated assets are verified above.
      - name: Install browser
        run: cd frontend && npx playwright install --with-deps chromium --only-shell
      - name: Desktop, mobile and built-path browser tests
        run: |
          npm --prefix frontend run test:e2e
          npm --prefix frontend run test:production
