name: strimkeep

# 拉取即装（不需要源码）。三种用法：
#
#   1) 最省事：sh install.sh         ← 问三个问题，自动生成 .env 并启动
#   2) 手动：  cp .env.example .env  →  只改 ADMIN_PASSWORD  →  docker compose -f docker-compose.install.yml up -d
#   3) 完全不建 .env：ADMIN_PASSWORD=你的密码 docker compose -f docker-compose.install.yml up -d
#
# 升级：docker compose -f docker-compose.install.yml pull && docker compose -f docker-compose.install.yml up -d

services:
  strimkeep:
    # 固定版本就在 .env 里写 STRIMKEEP_VERSION=0.9.150；默认 latest
    image: ghcr.io/xcgtb/strimkeep:${STRIMKEEP_VERSION:-latest}
    container_name: ${STRIMKEEP_CONTAINER_NAME:-strimkeep}
    # host 网络：反代端口、Emby 回调、播放地址都要能被局域网直接访问。
    # Docker Desktop 之类不支持 host 网络的环境，改成 ports: ["9000:9000"] 并删掉这行
    network_mode: host
    init: true
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请先设置 ADMIN_PASSWORD（至少 12 位），或直接运行 sh install.sh}
      STRIMKEEP_METRICS_TOKEN: ${STRIMKEEP_METRICS_TOKEN:-}
    volumes:
      # 只有这两个是必须的：数据（state.db/密钥/日志）+ STRM 输出
      - ${STRIMKEEP_DATA_DIR:-./data}:/data
      - ${STRIMKEEP_STRM_DIR:-./strm}:/strm
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health/ready', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m

  # 可选：连 Emby 一起装（docker compose ... --profile emby up -d）
  emby_strimkeep:
    profiles: ["emby"]
    container_name: emby_strimkeep
    image: emby/embyserver:latest
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      UID: ${EMBY_UID:-0}
      GID: ${EMBY_GID:-0}
    ports:
      - "${EMBY_PORT:-8096}:8096"
    volumes:
      - ${EMBY_CONFIG_DIR:-./emby}:/config
      - ${STRIMKEEP_STRM_DIR:-./strm}:/media
    restart: unless-stopped

networks:
  default:
    name: strimkeep_default
