# ════════════════════════════════════════════════════════════════
#  StrimKeep 部署文件（拉取镜像，不需要源码）
#
#  用法：
#    1) 按下面 ★必填 的提示改 3 处
#    2) docker compose -f docker-compose.install.yml up -d
#    3) 浏览器打开 http://本机IP:9000
#
#  升级：docker compose -f docker-compose.install.yml pull
#        docker compose -f docker-compose.install.yml up -d
# ════════════════════════════════════════════════════════════════

services:
  strimkeep:
    # 镜像：latest 跟随最新版本；想固定就改成 0.9.150
    image: ghcr.io/xcgtb/strimkeep:${STRIMKEEP_VERSION:-latest}
    # 容器名；同一台机器上试装可以改成 sk-test，避免顶掉正式实例
    container_name: ${STRIMKEEP_CONTAINER_NAME:-strimkeep}
    # 用宿主机网络：面板 9000、Emby 回调、播放地址都能被局域网直接访问
    # 若环境不支持 host 网络（如 Docker Desktop），删掉这行改成  ports: ["9000:9000"]
    network_mode: host
    init: true
    environment:
      # 时区
      - TZ=${TZ:-Asia/Shanghai}
      # 面板登录用户名
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      # ★必填：面板登录密码（至少 12 位）
      #        直接把这一行改成：  - ADMIN_PASSWORD=你的密码
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?请把这一行改成 - ADMIN_PASSWORD=你的密码（至少 12 位）}
      # 可选：/metrics 访问令牌，留空 = 不校验（内网一般不用管）
      - STRIMKEEP_METRICS_TOKEN=${STRIMKEEP_METRICS_TOKEN:-}
    volumes:
      # ★必填：数据目录（state.db / master.key / 日志），必须持久化并单独备份
      #        默认放在当前目录的 data/；要换盘就写成 /vol1/1000/strimkeep/data
      - ${STRIMKEEP_DATA_DIR:-./data}:/data
      # ★必填：STRM 输出目录，同时要被 Emby 挂载
      #        默认放在当前目录的 strm/；要换盘就写成 /vol1/1000/strimkeep/strm
      - ${STRIMKEEP_STRM_DIR:-./strm}:/strm
    restart: always
    # 停止时给整理任务 30 秒收尾，避免留下半截文件
    stop_grace_period: 30s
    # 健康检查：面板 /health/ready 返回 200 才算健康
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health/ready', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    # 日志轮转：最多留 3 个 10MB 文件
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m

  # ── 可选：连 Emby 一起装 ──────────────────────────────────────
  # 用不到就整段删掉；要用就在启动命令后加 --profile emby
  emby_strimkeep:
    profiles: ["emby"]
    container_name: emby_strimkeep
    image: emby/embyserver:latest
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - UID=${EMBY_UID:-0}
      - GID=${EMBY_GID:-0}
    ports:
      - "${EMBY_PORT:-8096}:8096"      # Emby 网页端口
    volumes:
      - ${EMBY_CONFIG_DIR:-./emby}:/config   # Emby 配置与缓存
      - ${STRIMKEEP_STRM_DIR:-./strm}:/media # 让 Emby 直接读 STRM 目录
    restart: always

networks:
  default:
    name: strimkeep_default
