services:
  strimkeep:
    image: ghcr.io/xcgtb/strimkeep:latest
    container_name: strimkeep
    network_mode: host
    env_file: .env
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - ./data:/data
      - ./strm:/strm
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
