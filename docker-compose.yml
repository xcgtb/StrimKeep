name: strimkeep

# 源码构建用：从当前目录构建镜像（开发 / 本机部署）。
# 只想起服务、不构建源码 → 用 docker-compose.install.yml（拉取镜像，三步安装）。
# 路径、口令、令牌走 .env（首次执行 bash start.sh 会自动生成 .env）。
services:
  # 可选：把 Emby 也交给 compose 管。不用的话整段删掉，只保留 strimkeep。
  emby_strimkeep:
    container_name: emby_strimkeep
    image: emby/embyserver:latest
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - UID=${EMBY_UID:-0}
      - GID=${EMBY_GID:-0}
    ports:
      - "${EMBY_PORT:-8096}:8096"
    volumes:
      - ${EMBY_CONFIG_DIR:-./emby}:/config
      - ${STRIMKEEP_STRM_DIR:-./strm}:/media
    restart: unless-stopped

  strimkeep:
    image: strimkeep:3.0.0
    build: .
    container_name: strimkeep
    # host 网络：反代端口、Webhook 回调都要能被局域网/播放器直接访问
    network_mode: host
    init: true
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      - STRIMKEEP_METRICS_TOKEN=${STRIMKEEP_METRICS_TOKEN:-}
      # 「媒体信息写入 Emby」用：可选。不填就只生成 sidecar，不写 Emby 库
      - STRIMKEEP_EMBY_LIBRARY_DB=${STRIMKEEP_EMBY_LIBRARY_DB:-}
      - STRIMKEEP_EMBY_STRM_MOUNT=${STRIMKEEP_EMBY_STRM_MOUNT:-}
    volumes:
      - ${STRIMKEEP_DATA_DIR:-./data}:/data
      - ${STRIMKEEP_STRM_DIR:-./strm}:/strm
      # 可选：Emby 的 data 目录（写媒体信息时才需要；不写就删掉这行）
      - ${EMBY_DATA_DIR:-./emby-data}:/emby-data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    stop_grace_period: 30s

networks:
  default:
    name: strimkeep_default
