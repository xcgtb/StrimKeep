name: strimkeep

# 默认拉 GHCR 上发布的镜像（ghcr.io/xcgtb/strimkeep:latest），不构建源码。
# 要从源码构建：docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# 路径、口令、令牌走 .env（缺失时执行 bash start.sh 会引导生成）。
services:
  # 可选：把 Emby 也交给 compose 管。不用的话整段删掉，只保留 strimkeep。
  emby_strimkeep:
    container_name: emby_strimkeep
    image: emby/embyserver:latest
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - UID=${EMBY_UID:-0}
      - GID=${EMBY_GID:-0}
    ports:
      - "${EMBY_PORT:-8096}:8096"
    volumes:
      - ${EMBY_CONFIG_DIR:-./emby}:/config
      - ${STRIMKEEP_STRM_DIR:-./strm}:/media
    restart: unless-stopped

  strimkeep:
    image: ghcr.io/xcgtb/strimkeep:latest
    container_name: strimkeep
    # host 网络：反代端口、Webhook 回调都要能被局域网/播放器直接访问
    network_mode: host
    init: true
    environment:
      - TZ=${TZ:-Asia/Shanghai}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-changeme}
      - STRIMKEEP_METRICS_TOKEN=${STRIMKEEP_METRICS_TOKEN:-}
      # 「媒体信息写入 Emby」用：可选。不填就只生成 sidecar，不写 Emby 库
      - STRIMKEEP_EMBY_LIBRARY_DB=${STRIMKEEP_EMBY_LIBRARY_DB:-}
      - STRIMKEEP_EMBY_STRM_MOUNT=${STRIMKEEP_EMBY_STRM_MOUNT:-}
    volumes:
      - ${STRIMKEEP_DATA_DIR:-./data}:/data
      - ${STRIMKEEP_STRM_DIR:-./strm}:/strm
      # 可选：Emby 的 data 目录（写媒体信息时才需要；不写就删掉这行）
      - ${EMBY_DATA_DIR:-./emby-data}:/emby-data
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-file: "3"
        max-size: 10m
    stop_grace_period: 30s

networks:
  default:
    name: strimkeep_default
